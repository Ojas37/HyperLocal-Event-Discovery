openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: events
    description: Event discovery and attendee workflows
  - name: organizers
    description: Organizer profiles and event management
  - name: attendees
    description: Personal events and registrations
  - name: communities
    description: Community listings and memberships
  - name: admin
    description: Protected moderation and trust operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: Search and filter published events
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: city
          schema: { type: string }
        - in: query
          name: mode
          schema: { type: string, enum: [in-person, hybrid, online] }
        - in: query
          name: price
          schema: { type: string, enum: [free, paid] }
        - in: query
          name: sort
          schema: { type: string, enum: [relevance, soonest, newest, popular] }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - in: query
          name: dateFrom
          schema: { type: string, format: date-time }
        - in: query
          name: dateTo
          schema: { type: string, format: date-time }
        - in: query
          name: latitude
          schema: { type: number, minimum: -90, maximum: 90 }
        - in: query
          name: longitude
          schema: { type: number, minimum: -180, maximum: 180 }
        - in: query
          name: radiusKm
          schema: { type: number, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: Matching events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Event" }
  /events/featured:
    get:
      operationId: getFeaturedEvents
      tags: [events]
      summary: Get featured upcoming events
      responses:
        "200":
          description: Featured events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Event" }
  /events/{eventId}:
    get:
      operationId: getEvent
      tags: [events]
      summary: Get event details
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Event details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "404": { description: Event not found }
  /events/{eventId}/rsvp:
    post:
      operationId: createRsvp
      tags: [attendees]
      summary: RSVP for an event or join its waitlist
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: integer }
      responses:
        "201":
          description: Registration created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rsvp" }
        "401": { description: Sign-in required }
        "409": { description: Registration already exists or event is unavailable }
    delete:
      operationId: cancelRsvp
      tags: [attendees]
      summary: Cancel an RSVP
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: integer }
      responses:
        "204": { description: RSVP cancelled }
        "401": { description: Sign-in required }
        "404": { description: RSVP not found }
  /events/{eventId}/save:
    post:
      operationId: saveEvent
      tags: [attendees]
      summary: Save an event
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Event saved }
        "401": { description: Sign-in required }
    delete:
      operationId: unsaveEvent
      tags: [attendees]
      summary: Remove an event from saved events
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Event removed from saved events }
        "401": { description: Sign-in required }
  /me/events:
    get:
      operationId: getMyEvents
      tags: [attendees]
      summary: Get the current user's RSVPs and saved events
      responses:
        "200":
          description: Personal event lists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyEvents" }
        "401": { description: Sign-in required }
  /organizer/me:
    get:
      operationId: getMyOrganizer
      tags: [organizers]
      summary: Get the current user's organizer profile
      responses:
        "200":
          description: Organizer profile or null
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/Organizer"
                  - type: "null"
        "401": { description: Sign-in required }
    post:
      operationId: createOrganizer
      tags: [organizers]
      summary: Create an organizer profile for the current user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizerInput" }
      responses:
        "201":
          description: Organizer profile created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organizer" }
        "401": { description: Sign-in required }
        "409": { description: Organizer profile already exists }
  /organizer/dashboard:
    get:
      operationId: getOrganizerDashboard
      tags: [organizers]
      summary: Get organizer events and live RSVP counts
      responses:
        "200":
          description: Organizer dashboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizerDashboard" }
        "401": { description: Sign-in required }
        "403": { description: Organizer profile required }
  /organizer/events:
    post:
      operationId: createOrganizerEvent
      tags: [organizers]
      summary: Create an event draft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventInput" }
      responses:
        "201":
          description: Event created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "401": { description: Sign-in required }
        "403": { description: Organizer profile required }
  /organizer/events/{eventId}/publish:
    post:
      operationId: publishOrganizerEvent
      tags: [organizers]
      summary: Publish an event owned by the current organizer
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Published event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "400": { description: Event is missing required information }
        "401": { description: Sign-in required }
        "403": { description: Organizer profile required }
        "404": { description: Event not found }
  /organizer/events/{eventId}:
    get:
      operationId: getOrganizerEvent
      tags: [organizers]
      summary: Get an event draft or published event for its owner
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Organizer event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "401": { description: Sign-in required }
        "403": { description: Event owner required }
        "404": { description: Event not found }
    patch:
      operationId: updateOrganizerEvent
      tags: [organizers]
      summary: Update an event owned by the current organizer
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateEventInput" }
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "401": { description: Sign-in required }
        "403": { description: Event owner required }
        "404": { description: Event not found }
  /organizer/events/{eventId}/cancel:
    post:
      operationId: cancelOrganizerEvent
      tags: [organizers]
      summary: Cancel an event and notify attendees
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Cancelled event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "401": { description: Sign-in required }
        "403": { description: Event owner required }
        "404": { description: Event not found }
  /organizer/events/{eventId}/attendees:
    get:
      operationId: getOrganizerAttendees
      tags: [organizers]
      summary: List event registrations for an owner or assigned staff member
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Registrations and check-in totals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendeeRoster" }
        "401": { description: Sign-in required }
        "403": { description: Organizer or event staff access required }
        "404": { description: Event not found }
  /organizer/events/{eventId}/check-ins:
    post:
      operationId: checkInAttendee
      tags: [organizers]
      summary: Validate and check in one confirmed attendee
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckInInput" }
      responses:
        "200":
          description: Check-in recorded or duplicate detected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckInResult" }
        "400": { description: Invalid or ineligible ticket }
        "401": { description: Sign-in required }
        "403": { description: Organizer or assigned staff required }
        "404": { description: Event or ticket not found }
  /organizer/events/{eventId}/staff:
    get:
      operationId: listEventStaff
      tags: [organizers]
      summary: List assigned event check-in staff
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Event staff
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EventStaff" }
        "401": { description: Sign-in required }
        "403": { description: Event owner required }
    post:
      operationId: assignEventStaff
      tags: [organizers]
      summary: Assign a Clerk user to event check-in
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignEventStaffInput" }
      responses:
        "201":
          description: Staff assignment created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventStaff" }
        "401": { description: Sign-in required }
        "403": { description: Event owner required }
        "409": { description: User is already assigned }
  /organizer/events/{eventId}/staff/{userId}:
    delete:
      operationId: removeEventStaff
      tags: [organizers]
      summary: Remove an event check-in staff assignment
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: integer }
        - in: path
          name: userId
          required: true
          schema: { type: string }
      responses:
        "204": { description: Staff assignment removed }
        "401": { description: Sign-in required }
        "403": { description: Event owner required }
  /organizer/events/{eventId}/registrations.csv:
    get:
      operationId: exportOrganizerRegistrations
      tags: [organizers]
      summary: Download the event registration roster as CSV
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: CSV registration export
          content:
            text/csv:
              schema: { type: string }
        "401": { description: Sign-in required }
        "403": { description: Organizer access required }
  /organizer/verification:
    post:
      operationId: requestOrganizerVerification
      tags: [organizers]
      summary: Request organizer profile verification
      responses:
        "200":
          description: Verification request status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organizer" }
        "401": { description: Sign-in required }
        "404": { description: Organizer profile not found }
  /events/{eventId}/reports:
    post:
      operationId: reportEvent
      tags: [events]
      summary: Report an event to LocalLoop moderators
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportEventInput" }
      responses:
        "201":
          description: Event report submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventReport" }
        "401": { description: Sign-in required }
        "404": { description: Event not found }
        "409": { description: Event already reported by this user }
  /events/{eventId}/reviews:
    get:
      operationId: listEventReviews
      tags: [events]
      summary: List attendee feedback for an event
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Event review list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EventReview" }
    post:
      operationId: createEventReview
      tags: [attendees]
      summary: Leave feedback after verified attendance
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventReviewInput" }
      responses:
        "201":
          description: Review saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventReview" }
        "401": { description: Sign-in required }
        "403": { description: Verified attendance required }
        "409": { description: Review already exists }
  /organizers/{organizerId}/follow:
    post:
      operationId: followOrganizer
      tags: [attendees]
      summary: Follow an organizer
      parameters:
        - in: path
          name: organizerId
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Organizer followed }
        "401": { description: Sign-in required }
        "404": { description: Organizer not found }
    delete:
      operationId: unfollowOrganizer
      tags: [attendees]
      summary: Unfollow an organizer
      parameters:
        - in: path
          name: organizerId
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Organizer unfollowed }
        "401": { description: Sign-in required }
  /communities:
    get:
      operationId: listCommunities
      tags: [communities]
      summary: List public communities
      parameters:
        - in: query
          name: city
          schema: { type: string }
      responses:
        "200":
          description: Public communities
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Community" }
    post:
      operationId: createCommunity
      tags: [communities]
      summary: Create a community for the current organizer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommunityInput" }
      responses:
        "201":
          description: Community created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Community" }
        "401": { description: Sign-in required }
        "403": { description: Organizer profile required }
  /communities/{slug}:
    get:
      operationId: getCommunity
      tags: [communities]
      summary: Get a public community and upcoming events
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Community details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunityDetail" }
        "404": { description: Community not found }
  /communities/{communityId}/join:
    post:
      operationId: joinCommunity
      tags: [communities]
      summary: Join a public community
      parameters:
        - in: path
          name: communityId
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Community joined }
        "401": { description: Sign-in required }
        "404": { description: Community not found }
    delete:
      operationId: leaveCommunity
      tags: [communities]
      summary: Leave a community
      parameters:
        - in: path
          name: communityId
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Community left }
        "401": { description: Sign-in required }
  /me/preferences:
    get:
      operationId: getMyPreferences
      tags: [attendees]
      summary: Get the current user's discovery and privacy preferences
      responses:
        "200":
          description: User preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPreferences" }
        "401": { description: Sign-in required }
    put:
      operationId: updateMyPreferences
      tags: [attendees]
      summary: Save interests, home city, and privacy preferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserPreferencesInput" }
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPreferences" }
        "401": { description: Sign-in required }
  /me/recommendations:
    get:
      operationId: getMyRecommendations
      tags: [events]
      summary: Recommend upcoming events using saved interests and follows
      responses:
        "200":
          description: Personalized upcoming events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Event" }
        "401": { description: Sign-in required }
  /me/notifications:
    get:
      operationId: getMyNotifications
      tags: [attendees]
      summary: Get in-app notifications for the current user
      responses:
        "200":
          description: Recent notifications
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Notification" }
        "401": { description: Sign-in required }
  /me/notifications/{notificationId}/read:
    post:
      operationId: markNotificationRead
      tags: [attendees]
      summary: Mark one notification as read
      parameters:
        - in: path
          name: notificationId
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Notification marked as read }
        "401": { description: Sign-in required }
  /me/badges:
    get:
      operationId: getMyAttendanceBadges
      tags: [attendees]
      summary: Get attendance badges earned through verified check-in
      responses:
        "200":
          description: Verified attendance badges
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AttendanceBadge" }
        "401": { description: Sign-in required }
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [admin]
      summary: Get moderation queue counts
      responses:
        "200":
          description: Admin dashboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDashboard" }
        "401": { description: Sign-in required }
        "403": { description: Administrator access required }
  /admin/reports:
    get:
      operationId: listAdminReports
      tags: [admin]
      summary: List event reports for moderation
      responses:
        "200":
          description: Event report queue
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EventReport" }
        "401": { description: Sign-in required }
        "403": { description: Administrator access required }
  /admin/verifications:
    get:
      operationId: listAdminVerifications
      tags: [admin]
      summary: List pending organizer verification requests
      responses:
        "200":
          description: Pending organizer verification requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OrganizerVerificationRequest" }
        "401": { description: Sign-in required }
        "403": { description: Administrator access required }
  /admin/reports/{reportId}:
    patch:
      operationId: resolveAdminReport
      tags: [admin]
      summary: Resolve or dismiss an event report
      parameters:
        - in: path
          name: reportId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModerateReportInput" }
      responses:
        "200":
          description: Updated report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventReport" }
        "401": { description: Sign-in required }
        "403": { description: Administrator access required }
        "404": { description: Report not found }
  /admin/organizers/{organizerId}/verification:
    post:
      operationId: reviewOrganizerVerification
      tags: [admin]
      summary: Approve or reject organizer verification
      parameters:
        - in: path
          name: organizerId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminVerificationInput" }
      responses:
        "200":
          description: Updated organizer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organizer" }
        "401": { description: Sign-in required }
        "403": { description: Administrator access required }
        "404": { description: Organizer not found }
  /admin/users/{userId}/suspension:
    post:
      operationId: suspendAdminUser
      tags: [admin]
      summary: Suspend a user account
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SuspendUserInput" }
      responses:
        "204": { description: User suspended }
        "401": { description: Sign-in required }
        "403": { description: Administrator access required }
    delete:
      operationId: unsuspendAdminUser
      tags: [admin]
      summary: Restore a suspended user account
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      responses:
        "204": { description: User restored }
        "401": { description: Sign-in required }
        "403": { description: Administrator access required }
  /admin/users/{userId}/role:
    put:
      operationId: assignAdminRole
      tags: [admin]
      summary: Assign or remove a moderator role
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignUserRoleInput" }
      responses:
        "204": { description: Role updated }
        "401": { description: Sign-in required }
        "403": { description: Administrator access required }
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    OrganizerSummary:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        verified: { type: boolean }
      required: [id, name, verified]
    Organizer:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        type: { type: string }
        description: { type: string }
        verified: { type: boolean }
        verificationStatus: { type: string, enum: [not_requested, pending, approved, rejected] }
      required: [id, name, type, description, verified, verificationStatus]
    OrganizerInput:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        type: { type: string, enum: [individual, college-club, community, startup, company] }
        description: { type: string, maxLength: 1000 }
      required: [name, type]
    Event:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        slug: { type: string }
        description: { type: string }
        category: { type: string }
        tags:
          type: array
          items: { type: string }
        bannerUrl: { type: string }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        timezone: { type: string }
        venue: { type: string }
        city: { type: string }
        latitude: { type: ["number", "null"], minimum: -90, maximum: 90 }
